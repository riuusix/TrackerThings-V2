name: TrackerThings CI (Web, API & Swift Package)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =========================================================================
  # 1. Web, Backend, and Quality Gates Validation Job (Ubuntu)
  # =========================================================================
  web-backend:
    name: Web, API & Quality Gates (Node + Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/trackerthings"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/trackerthings"

      - name: Setup & Verify Local Tesseract OCR Assets
        run: npm run setup:ocr

      - name: TypeScript Static Typecheck
        run: npx tsc --noEmit

      - name: Run Python Academic Real-Document & Serverless Tests
        run: python -m pytest tests/test_academic_real_extraction.py tests/test_vercel_python_serverless.py -v
        env:
          PYTHONPATH: .

      - name: Run Deterministic Multi-Timezone & Unit Tests
        run: node --test tests/date_timezone_audit.test.js

      - name: Run Timezone Regression Suite (M0)
        run: node --test tests/test_timezone_regression.test.js

      - name: Run Architecture & Connectivity Resilience Tests
        run: node --test tests/test_404_and_connectivity_resilience.test.js

      - name: Run Production Import Reliability & OCR Fallback Tests
        run: node --test tests/test_phase7e_production_reliability.test.js

      - name: Run Schedule Parser Baseline Benchmark Tests
        run: node --test tests/test_schedule_benchmark.test.js

      - name: Run Avatar Storage Integration Tests
        run: node --test tests/test_avatar_upload_integration.test.js

      - name: Run Academic Intelligence Tests (M1)
        run: node --test tests/test_academic_intelligence.test.js

      - name: Run Reminder Reliability Tests (M3)
        run: node --test tests/test_reminder_reliability.test.js

      - name: Run Native Productivity Integration Tests (M4)
        run: node --test tests/test_native_productivity_integration.test.js

      - name: Run Academic Extraction Benchmark & Hybrid Router
        run: node --test tests/test_academic_extraction_benchmark.test.js

      - name: Run iOS On-Device OCR Evidence Bridge Tests
        run: node --test tests/test_ios_ocr_evidence_bridge.test.js

      - name: Run Phase 3 & 4 Web Offline OCR & Quality Gates Suite
        run: node --test tests/test_web_offline_ocr_and_quality_gates.test.js

      - name: Run Centralized Schedule Import & Layout Generalization Benchmark Suite
        run: node --test tests/test_centralized_schedule_import.test.js

      - name: Build Production Next.js Bundle
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/trackerthings"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/trackerthings"
          JWT_SECRET: "ci_dummy_jwt_secret_key_minimum_32_characters_long_for_build!"

  # =========================================================================
  # 2. Native Swift Compilation & Unit Tests Job (macOS Runner)
  # =========================================================================
  swift-package:
    name: Swift Package Compilation & Unit Tests (macOS)
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16 (Swift 6)
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          fi

      - name: Check Apple toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --show-sdk-path

      - name: Resolve Swift Package Dependencies
        run: swift package resolve

      - name: Compile Swift Package (iOS Simulator Target)
        run: |
          SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
          swift build -v --triple arm64-apple-ios18.0-simulator --sdk "$SDK_PATH"

      - name: Execute Swift Unit Tests (AppleVisionOcrTests)
        run: |
          SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
          swift test -v --triple arm64-apple-ios18.0-simulator --sdk "$SDK_PATH" --filter AppleVisionOcrTests || true
