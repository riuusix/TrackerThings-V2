name: Build TrackerThings IPA

on:
  push:
    branches:
      - main
      - test/appicon-assets-car
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Apple toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun -sdk iphoneos -show-sdk-path

      - name: Install xtool
        run: |
          brew install xtool-org/tap/xtool
          xtool --help

      - name: Build IPA
        run: |
          xtool dev build --ipa --configuration release

      - name: Locate IPA
        run: |
          IPA_PATH="$(find . -type f -name '*.ipa' \
            -not -path './.git/*' -print -quit)"

          if [ -z "$IPA_PATH" ]; then
            echo "::error::Build finished without producing an IPA."
            exit 1
          fi

          mkdir -p dist
          cp "$IPA_PATH" dist/TrackerThings.ipa
          ls -lh dist/TrackerThings.ipa

      - name: Compile Asset Catalog and Integrate Assets.car into IPA
        run: |
          set -euo pipefail

          echo "=== 1. Compiling Assets.xcassets using Apple actool ==="
          mkdir -p build/assets
          xcrun actool Assets.xcassets \
            --compile build/assets \
            --platform iphoneos \
            --target-device iphone \
            --target-device ipad \
            --minimum-deployment-target 18.0 \
            --app-icon AppIcon \
            --output-partial-info-plist build/partial.plist \
            --warnings \
            --errors

          echo "=== 2. Verifying actool compilation output ==="
          if [ ! -f "build/assets/Assets.car" ]; then
            echo "::error::Compilation failed: Assets.car was not generated by actool!"
            exit 1
          fi

          ASSETS_SIZE=$(stat -f%z "build/assets/Assets.car" 2>/dev/null || stat -c%s "build/assets/Assets.car")
          if [ "$ASSETS_SIZE" -le 0 ]; then
            echo "::error::Compilation failed: Assets.car is empty (0 bytes)!"
            exit 1
          fi
          echo "Assets.car generated successfully: $ASSETS_SIZE bytes"

          if [ -f "build/partial.plist" ]; then
            echo "Partial Info.plist from actool:"
            cat build/partial.plist
          fi

          echo "=== 3. Extracting xtool IPA into full staging directory ==="
          FINAL_IPA="$(pwd)/dist/TrackerThings.ipa"
          rm -rf ipa_staging
          mkdir -p ipa_staging
          unzip -q "$FINAL_IPA" -d ipa_staging

          APP_DIR="ipa_staging/Payload/TrackerThings.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "::error::Extraction failed: $APP_DIR does not exist!"
            exit 1
          fi

          echo "=== 4. Checking Code Signature status and computing checksums ==="
          if [ -d "$APP_DIR/_CodeSignature" ]; then
            echo "::warning::_CodeSignature detected in raw IPA. Modifying bundle will invalidate existing signature; resigning will be required upon installation."
          else
            echo "Info: Raw IPA is unsigned (no _CodeSignature). Sideloading utilities will sign bundle upon device installation."
          fi

          if [ ! -f "$APP_DIR/TrackerThings" ]; then
            echo "::error::Executable TrackerThings is missing from extracted bundle!"
            exit 1
          fi
          if [ ! -f "$APP_DIR/Info.plist" ]; then
            echo "::error::Info.plist is missing from extracted bundle!"
            exit 1
          fi

          ORIG_EXEC_SHA=$(shasum -a 256 "$APP_DIR/TrackerThings" | awk '{print $1}')
          ORIG_PLIST_SHA=$(shasum -a 256 "$APP_DIR/Info.plist" | awk '{print $1}')
          echo "Original TrackerThings SHA256: $ORIG_EXEC_SHA"
          echo "Original Info.plist SHA256:    $ORIG_PLIST_SHA"

          echo "=== 5. Injecting Assets.car into full staging bundle ==="
          cp build/assets/Assets.car "$APP_DIR/Assets.car"

          echo "=== 6. Rebuilding final IPA to absolute path $FINAL_IPA ==="
          rm -f "$FINAL_IPA"
          (cd ipa_staging && zip -qry "$FINAL_IPA" Payload)

          echo "=== 7. Rigorous Automated Verification of final IPA ==="
          if [ ! -s "$FINAL_IPA" ]; then
            echo "::error::Final IPA file missing or empty at $FINAL_IPA!"
            exit 1
          fi

          # Verify Assets.car exists in final IPA
          if ! unzip -l "$FINAL_IPA" | grep -q "Payload/TrackerThings.app/Assets.car"; then
            echo "::error::Final IPA verification failed: Assets.car is missing!"
            exit 1
          fi

          # Verify executable checksum matches exactly
          FINAL_EXEC_SHA=$(unzip -p "$FINAL_IPA" Payload/TrackerThings.app/TrackerThings | shasum -a 256 | awk '{print $1}')
          if [ "$ORIG_EXEC_SHA" != "$FINAL_EXEC_SHA" ]; then
            echo "::error::Integrity check failed: TrackerThings executable changed after repacking!"
            exit 1
          fi
          echo "Verified: Executable SHA256 is bit-identical."

          # Verify Info.plist checksum matches exactly
          FINAL_PLIST_SHA=$(unzip -p "$FINAL_IPA" Payload/TrackerThings.app/Info.plist | shasum -a 256 | awk '{print $1}')
          if [ "$ORIG_PLIST_SHA" != "$FINAL_PLIST_SHA" ]; then
            echo "::error::Integrity check failed: Info.plist changed after repacking!"
            exit 1
          fi
          echo "Verified: Info.plist SHA256 is bit-identical."

          # Extract and verify Info.plist XML content and icon metadata
          mkdir -p verify_tmp
          unzip -p "$FINAL_IPA" Payload/TrackerThings.app/Info.plist > verify_tmp/Info.plist
          if ! grep -q "CFBundleIconName" verify_tmp/Info.plist; then
            echo "::error::Final IPA verification failed: CFBundleIconName is missing in Info.plist!"
            exit 1
          fi
          if ! grep -q "CFBundleIcons" verify_tmp/Info.plist; then
            echo "::error::Final IPA verification failed: CFBundleIcons is missing in Info.plist!"
            exit 1
          fi

          echo "=== 8. Verification Successful: Complete Bundle Structure ==="
          unzip -l "$FINAL_IPA" | grep "Payload/TrackerThings.app"
          rm -rf verify_tmp ipa_staging build


      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrackerThings-IPA
          path: dist/TrackerThings.ipa
          if-no-files-found: error
          retention-days: 7
